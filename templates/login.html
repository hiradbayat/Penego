<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Penego</title>
    <link href="/assets/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:420px">
    <div class="text-center mb-4">
        <img src="/assets/logo.png" alt="Penego" width="200">
        <h1 class="h3 mt-3">Sign in</h1>
        <p class="text-muted">Lab admin password required</p>
    </div>
    {{if .auth_disabled}}
    <div class="alert alert-info">Authentication is disabled. <a href="/">Continue</a></div>
    {{else}}
    {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
    <form method="POST" action="/login" class="card card-body shadow-sm">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control mb-3" id="password" name="password" required autofocus>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    {{end}}
</div>
</body>
</html>
