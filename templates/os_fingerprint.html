<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} — Penego</title>
    <link href="/assets/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{{template "nav" .}}
<div class="container py-4">
    <div class="text-center mb-5">
        <h1 class="display-4 text-primary mb-2">OS Fingerprinting</h1>
        <p class="lead text-muted">Identify operating systems on network hosts (requires nmap)</p>
    </div>
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white"><h2 class="h5 mb-0">New Fingerprint</h2></div>
        <div class="card-body">
            <form id="osForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="target">Target</label>
                        <input class="form-control" id="target" name="target" placeholder="192.168.1.1 or 192.168.1.0/24" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="concurrency">Concurrency</label>
                        <input type="number" class="form-control" id="concurrency" name="concurrency" value="20">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="timeout_ms">Timeout (ms)</label>
                        <input type="number" class="form-control" id="timeout_ms" name="timeout_ms" value="1000">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Start Fingerprinting</button>
                </div>
            </form>
        </div>
    </div>
    <div id="results" class="card shadow-sm mb-4" style="display:none">
        <div class="card-header bg-success text-white"><h2 class="h5 mb-0">Results</h2></div>
        <div class="card-body"><div id="resultContent"></div></div>
    </div>
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white"><h2 class="h5 mb-0">Previous Fingerprints</h2></div>
        <div class="card-body">
            <button type="button" class="btn btn-outline-secondary mb-3" id="loadScansBtn">Load Previous Fingerprints</button>
            <div id="scansList"></div>
        </div>
    </div>
</div>
<script src="/assets/bootstrap.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
document.getElementById('osForm').addEventListener('submit', (e) => {
  e.preventDefault();
  Penego.submitScan(e.target, '/api/os_fingerprint', 'os_fingerprint');
});
document.getElementById('loadScansBtn').addEventListener('click', () => {
  Penego.loadScans(document.getElementById('scansList'), 'os_fingerprint');
});
</script>
</body>
</html>
