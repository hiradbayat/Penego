<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} — Penego</title>
    <link href="/assets/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/app.css" rel="stylesheet">
</head>
<body class="bg-light">
{{template "nav" .}}
<div class="container py-4">
    <h1 class="display-6 text-primary">Assessment Pipeline</h1>
    <p class="text-muted">One job: host discovery → TCP ports → HTTP/TLS enum → vuln matching → asset upsert</p>
    <div class="card shadow-sm mb-4"><div class="card-body">
        <form id="pipeForm">
            <div class="row g-3">
                <div class="col-md-5"><label class="form-label">Target</label><input class="form-control" name="target" required placeholder="192.168.1.0/24"></div>
                <div class="col-md-4"><label class="form-label">Ports</label><input class="form-control" name="ports" value="21,22,23,25,53,80,110,139,443,445,3306,3389,5432,8080,8443"></div>
                <div class="col-md-3"><label class="form-label">Engagement ID</label><input class="form-control" name="engagement_id" id="engagement_id" type="number" required></div>
            </div>
            <button class="btn btn-primary mt-3 w-100" type="submit">Run assessment pipeline</button>
        </form>
    </div></div>
    <div id="results" class="card shadow-sm mb-4" style="display:none"><div class="card-header bg-success text-white">Results</div><div class="card-body"><div id="resultContent"></div></div></div>
    {{template "history" .}}
</div>
<script src="/assets/bootstrap.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
Penego.fillEngagementFromQuery();
document.getElementById('pipeForm').addEventListener('submit', e => {
  e.preventDefault();
  Penego.submitScan(e.target, '/api/assessment_pipeline', 'assessment_pipeline');
});
Penego.initHistory('assessment_pipeline');
</script>
</body>
</html>
