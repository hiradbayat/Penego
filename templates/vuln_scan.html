<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} — Penego</title>
    <link href="/assets/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{{template "nav" .}}
<div class="container py-4">
    <div class="text-center mb-5">
        <h1 class="display-4 text-primary mb-2">Vulnerability Scanning</h1>
        <p class="lead text-muted">Non-exploitative banner/version checks against known advisory patterns</p>
    </div>
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white"><h2 class="h5 mb-0">New Vuln Scan</h2></div>
        <div class="card-body">
            <form id="vulnForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="target">Target</label>
                        <input class="form-control" id="target" name="target" placeholder="192.168.1.1 or 192.168.1.0/24">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="ports">Ports</label>
                        <input class="form-control" id="ports" name="ports" value="21,22,23,25,80,443,3306,5432,8080,8443">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="source_scan_id">Or analyze prior scan ID</label>
                        <input type="number" class="form-control" id="source_scan_id" name="source_scan_id" placeholder="optional">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="concurrency">Concurrency</label>
                        <input type="number" class="form-control" id="concurrency" name="concurrency" value="50">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="timeout_ms">Timeout (ms)</label>
                        <input type="number" class="form-control" id="timeout_ms" name="timeout_ms" value="1000">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Start Vuln Scan</button>
                </div>
            </form>
        </div>
    </div>
    <div id="results" class="card shadow-sm mb-4" style="display:none">
        <div class="card-header bg-success text-white"><h2 class="h5 mb-0">Results</h2></div>
        <div class="card-body"><div id="resultContent"></div></div>
    </div>
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white"><h2 class="h5 mb-0">Previous Vuln Scans</h2></div>
        <div class="card-body">
            <button type="button" class="btn btn-outline-secondary mb-3" id="loadScansBtn">Load Previous Scans</button>
            <div id="scansList"></div>
        </div>
    </div>
</div>
<script src="/assets/bootstrap.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
document.getElementById('vulnForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (!fd.get('target') && !fd.get('source_scan_id')) {
    alert('Provide a target or a prior scan ID');
    return;
  }
  if (!fd.get('target')) e.target.target.value = '127.0.0.1';
  Penego.submitScan(e.target, '/api/vuln_scan', 'vuln_scan');
});
document.getElementById('loadScansBtn').addEventListener('click', () => {
  Penego.loadScans(document.getElementById('scansList'), 'vuln_scan');
});
</script>
</body>
</html>
