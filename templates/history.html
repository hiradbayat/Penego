{{define "history"}}
<div class="card shadow-sm" id="historyCard">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2 class="h5 mb-0">{{.history_title}}</h2>
        <span class="badge bg-light text-dark" id="historyCount">—</span>
    </div>
    <div class="card-body">
        <form id="historyFilters" class="row g-2 align-items-end mb-3" data-scan-type="{{.scan_type}}">
            <div class="col-md-5">
                <label class="form-label" for="historySearch">Search</label>
                <input type="search" class="form-control" id="historySearch" name="q"
                       placeholder="Scan ID, target, ports…" autocomplete="off">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="historyStatus">Status</label>
                <select class="form-select" id="historyStatus" name="status">
                    <option value="">All statuses</option>
                    <option value="done">Done</option>
                    <option value="running">Running</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="historyLimit">Per page</label>
                <select class="form-select" id="historyLimit" name="limit">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Filter</button>
            </div>
        </form>
        <div id="scansList" class="scan-history-list"></div>
        <nav class="d-flex justify-content-between align-items-center mt-3" id="historyPagination" hidden>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="historyPrev">Previous</button>
            <span class="text-muted small" id="historyPageLabel"></span>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="historyNext">Next</button>
        </nav>
    </div>
</div>
{{end}}
