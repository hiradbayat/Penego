<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} — Penego</title>
    <link href="/assets/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/app.css" rel="stylesheet">
</head>
<body class="bg-light">
{{template "nav" .}}
<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="display-5 text-primary mb-2">Port Scanner</h1>
        <p class="lead text-muted">Scan your network for open ports and services</p>
    </div>
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white"><h2 class="h5 mb-0">New Scan</h2></div>
        <div class="card-body">
            <form id="scanForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="target">Target</label>
                        <input class="form-control" id="target" name="target" placeholder="192.168.1.1 or 192.168.1.0/24" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="ports">Ports</label>
                        <input class="form-control" id="ports" name="ports" value="22,80,443" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="host_concurrency">Host concurrency</label>
                        <input type="number" class="form-control" id="host_concurrency" name="host_concurrency" value="100">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="port_concurrency">Port concurrency</label>
                        <input type="number" class="form-control" id="port_concurrency" name="port_concurrency" value="100">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="timeout_ms">Timeout (ms)</label>
                        <input type="number" class="form-control" id="timeout_ms" name="timeout_ms" value="1000">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="grab_banner" name="grab_banner" checked>
                            <label class="form-check-label" for="grab_banner">Banner grab</label>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Start Scan</button>
                </div>
            </form>
        </div>
    </div>
    <div id="results" class="card shadow-sm mb-4" style="display:none">
        <div class="card-header bg-success text-white"><h2 class="h5 mb-0">Results</h2></div>
        <div class="card-body"><div id="resultContent"></div></div>
    </div>
    {{template "history" .}}
</div>
<script src="/assets/bootstrap.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
document.getElementById('scanForm').addEventListener('submit', (e) => {
  e.preventDefault();
  Penego.submitScan(e.target, '/api/scan', 'port_scan');
});
Penego.initHistory('port_scan');
</script>
</body>
</html>
